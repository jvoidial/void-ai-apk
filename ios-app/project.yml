name: VOIDAI
options:
  bundleIdPrefix: com.voidai
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"

targets:
  VOIDAI:
    type: application
    platform: iOS
    sources:
      - path: VOIDAI
        excludes:
          - Info.plist
      - path: ../android-app/app/src/main/assets/index.html
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.voidai.app
        PRODUCT_NAME: VOIDAI
        INFOPLIST_FILE: VOIDAI/Info.plist
        MARKETING_VERSION: "1.7.1"
        CURRENT_PROJECT_VERSION: "9"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""

schemes:
  VOIDAI:
    build:
      targets:
        VOIDAI: all
    run:
      config: Debug
    archive:
      config: Release
