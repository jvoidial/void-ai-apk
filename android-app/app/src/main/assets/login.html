<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>VOIDAI · Sign in</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #000; color: #ededed;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #card {
    width: 100%;
    max-width: 380px;
    padding: 32px 24px;
    text-align: center;
  }
  #brand {
    font-size: 42px;
    font-weight: 300;
    letter-spacing: -0.04em;
    color: #2a2a2a;
    margin-bottom: 8px;
  }
  #sub {
    font-size: 13px;
    color: #555;
    margin-bottom: 40px;
  }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 14px 18px;
    background: #fff;
    color: #000;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    margin-bottom: 12px;
  }
  .btn:active { opacity: 0.85; }
  .btn.secondary {
    background: transparent;
    color: #c0c0c0;
    border: 1px solid #222;
  }
  .btn svg { width: 20px; height: 20px; }
  #status {
    margin-top: 24px;
    font-size: 11px;
    color: #555;
    font-family: ui-monospace, monospace;
    min-height: 16px;
  }
  #user-info {
    display: none;
    margin-top: 8px;
    font-size: 12px;
    color: #a0a0a0;
  }
</style>
</head>
<body>
<div id="card">
  <div id="brand">VOIDAI</div>
  <div id="sub">Sign in to sync your chats and files</div>

  <button class="btn" id="github-btn" onclick="signInGitHub()">
    <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
      <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
    </svg>
    Sign in with GitHub
  </button>

  <button class="btn secondary" onclick="goToChat()">Continue without signing in</button>

  <div id="status">checking…</div>
  <div id="user-info"></div>
</div>

<script>
(function() {
  'use strict';

  function setStatus(t) {
    document.getElementById('status').textContent = t;
  }

  function hasBridge() {
    return typeof window.Android !== 'undefined' && window.Android !== null;
  }

  // On load: check if already signed in via Android bridge
  window.addEventListener('DOMContentLoaded', function() {
    if (!hasBridge()) {
      setStatus('(preview mode — no Android)');
      return;
    }
    try {
      var email = window.Android.getCurrentUser();
      if (email) {
        setStatus('signed in');
        document.getElementById('user-info').style.display = 'block';
        document.getElementById('user-info').textContent = email;
        setTimeout(goToChat, 800);
      } else {
        setStatus('not signed in');
      }
    } catch(e) {
      setStatus('bridge error: ' + e.message);
    }
  });

  // Called by Android after successful sign-in
  window.onSignedIn = function(email, name) {
    setStatus('signed in');
    document.getElementById('user-info').style.display = 'block';
    document.getElementById('user-info').textContent = name || email || '';
    setTimeout(goToChat, 800);
  };

  window.onSignedOut = function() {
    setStatus('signed out');
    document.getElementById('user-info').style.display = 'none';
  };

  window.onAuthError = function(msg) {
    setStatus('error: ' + msg);
  };

  // Buttons
  window.signInGitHub = function() {
    if (!hasBridge()) {
      setStatus('sign-in requires the Android app');
      return;
    }
    setStatus('opening GitHub…');
    try {
      window.Android.signInWithGitHub();
    } catch(e) {
      setStatus('error: ' + e.message);
    }
  };

  window.goToChat = function() {
    window.location.href = 'index.html';
  };

  setStatus('ready');
})();
</script>
</body>
</html>
