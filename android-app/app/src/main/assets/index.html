<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOIDAI – Local GPT</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui; background: #0d0d0d; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; padding: 12px; max-width: 600px; margin: auto; }
#chat { flex: 1; overflow-y: auto; }
.msg { margin: 8px 0; padding: 8px 12px; border-radius: 16px; max-width: 85%; word-wrap: break-word; }
.user { background: #2a2a2a; align-self: flex-end; }
.ai { background: #1a3a1a; align-self: flex-start; }
#input-area { display: flex; gap: 8px; margin-top: 8px; border-top: 1px solid #222; padding-top: 8px; }
#input { flex: 1; padding: 10px; border-radius: 20px; background: #1a1a1a; color: #fff; border: none; outline: none; }
button { background: #6f6; color: #000; border: none; padding: 10px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; }
#status { font-size: 12px; color: #888; text-align: center; margin-bottom: 8px; }
#settings-btn { background: #333; color: #fff; padding: 4px 12px; border-radius: 16px; font-size: 12px; position: fixed; top: 12px; right: 12px; }
</style>
</head>
<body>
<div id="status">⏳ Loading model...</div>
<div id="chat"></div>
<div id="input-area">
<input id="input" placeholder="Ask VOIDAI..." autofocus>
<button id="send">Send</button>
</div>
<script type="importmap">{"imports":{"webllm":"https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.66/dist/web-llm.js"}}</script>
<script type="module">
import * as webllm from 'webllm';
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const status = document.getElementById('status');
let engine = null;
let modelName = 'Phi-3-mini-4k-instruct-q4f16_1';
let conversation = [];
async function init() {
    try {
        status.textContent = '⏳ Downloading model (first time may take a few minutes)...';
        engine = new webllm.ChatModule();
        await engine.reload(modelName);
        status.textContent = '✅ ready';
        addMessage('ai', `VOIDAI ready with ${modelName}. Ask me anything.`);
    } catch (e) {
        status.textContent = '❌ model failed: ' + e.message;
        addMessage('ai', 'Model load error: ' + e.message);
    }
}
function addMessage(role, text) {
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}
async function handleSend() {
    const text = input.value.trim();
    if (!text || !engine) return;
    input.value = '';
    addMessage('user', text);
    conversation.push({ role: 'user', content: text });
    try {
        const response = await engine.chat.completions.create({
            messages: conversation,
            temperature: 0.7,
            max_tokens: 512,
            stream: false
        });
        const reply = response.choices[0].message.content;
        addMessage('ai', reply);
        conversation.push({ role: 'assistant', content: reply });
    } catch (e) {
        addMessage('ai', 'Error: ' + e.message);
    }
}
sendBtn.addEventListener('click', handleSend);
input.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleSend(); });
init();
</script>
</body>
</html>
