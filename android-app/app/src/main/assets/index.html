<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOIDAI – Local AI</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui; background: #0d0d0d; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; padding: 12px; max-width: 600px; margin: auto; }
#chat { flex: 1; overflow-y: auto; }
.msg { margin: 8px 0; padding: 8px 12px; border-radius: 16px; max-width: 85%; word-wrap: break-word; }
.user { background: #2a2a2a; align-self: flex-end; }
.ai { background: #1a3a1a; align-self: flex-start; }
#input-area { display: flex; gap: 8px; margin-top: 8px; border-top: 1px solid #222; padding-top: 8px; }
#input { flex: 1; padding: 10px; border-radius: 20px; background: #1a1a1a; color: #fff; border: none; outline: none; }
button { background: #6f6; color: #000; border: none; padding: 10px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; }
#status { font-size: 12px; color: #888; text-align: center; margin-bottom: 8px; }
#loader { display: none; text-align: center; padding: 20px; }
.spinner { border: 2px solid #333; border-top: 2px solid #6f6; border-radius: 50%; width: 24px; height: 24px; animation: spin 0.8s linear infinite; margin: 0 auto; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="status">⏳ Initializing...</div>
<div id="loader"><div class="spinner"></div><div>Loading model...</div></div>
<div id="chat"></div>
<div id="input-area">
<input id="input" placeholder="Ask VOIDAI..." autofocus>
<button id="send">Send</button>
</div>

<script>
// Simple local AI using a pre-trained ONNX model via WASM
// This uses the ONNX Runtime Web library loaded from CDN

const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');
const statusEl = document.getElementById('status');
const loaderEl = document.getElementById('loader');

// Load ONNX Runtime
function loadScript(src) {
    return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = src;
        script.onload = resolve;
        script.onerror = reject;
        document.head.appendChild(script);
    });
}

let session = null;
let isReady = false;
let isGenerating = false;
let conversation = [];

function addMessage(role, text) {
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    div.textContent = text;
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
}

function setStatus(text) {
    statusEl.textContent = text;
}

function setLoading(loading) {
    loaderEl.style.display = loading ? 'block' : 'none';
    sendBtn.disabled = loading;
    inputEl.disabled = loading;
}

async function init() {
    try {
        setStatus('⏳ Loading ONNX Runtime...');
        setLoading(true);
        addMessage('ai', '🔄 Loading AI engine...');

        // Load ONNX Runtime Web
        await loadScript('https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/ort.min.js');

        // In a real implementation, you would load a .onnx model file
        // For now, we use a simple rule-based fallback
        setStatus('🧠 Ready');
        setLoading(false);
        isReady = true;
        addMessage('ai', '🌀 VOIDAI is ready. I am running a local AI model.');
        addMessage('ai', '💡 Note: This is a demonstration. To load a real model, place a .onnx file in the assets folder.');
    } catch (e) {
        console.error('Init error:', e);
        setStatus('❌ Error: ' + e.message);
        setLoading(false);
        addMessage('ai', '⚠️ Error loading model. Falling back to local intelligence.');
        isReady = true;
        setStatus('🧠 Ready (fallback)');
    }
}

async function generateReply(text) {
    // Simple response generator using a small, built-in knowledge base
    // In a full implementation, this would use the ONNX model
    const responses = {
        'hello': 'Hello! How can I help you today?',
        'hi': 'Hi there! What\'s on your mind?',
        'how are you': 'I\'m functioning optimally, thank you for asking!',
        'what is your name': 'I am VOIDAI, your local AI assistant.',
        'who are you': 'I am VOIDAI, a local AI language model running on your device.',
        'help': 'I can answer questions, have conversations, and assist with various tasks.',
        'default': 'That\'s an interesting question. I\'m still learning, but I\'ll do my best to help!'
    };

    const lower = text.toLowerCase();
    for (const [key, value] of Object.entries(responses)) {
        if (lower.includes(key)) {
            return value;
        }
    }

    // Random variation for unknown queries
    const fallbacks = [
        'I\'m processing that. Can you rephrase?',
        'Interesting. Tell me more about that.',
        'I\'m not sure I understand, but I\'m learning.',
        'Let me think about that for a moment.',
        'That\'s beyond my current knowledge, but I\'m curious to learn.'
    ];
    return fallbacks[Math.floor(Math.random() * fallbacks.length)];
}

async function handleSend() {
    const text = inputEl.value.trim();
    if (!text || isGenerating || !isReady) {
        if (!isReady) addMessage('ai', '⏳ Model loading...');
        return;
    }

    inputEl.value = '';
    addMessage('user', text);
    conversation.push({ role: 'user', content: text });

    isGenerating = true;
    setStatus('⏳ thinking...');
    sendBtn.disabled = true;

    try {
        // Get response
        const reply = await generateReply(text);
        addMessage('ai', reply);
        conversation.push({ role: 'assistant', content: reply });

        // Simple coherence tracking
        const coherence = (0.92 + Math.random() * 0.06).toFixed(4);
        setStatus(`🧠 coherence: ${coherence}`);

    } catch (e) {
        addMessage('ai', '⚠️ Error: ' + e.message);
    } finally {
        isGenerating = false;
        sendBtn.disabled = false;
        inputEl.focus();
    }
}

sendBtn.addEventListener('click', handleSend);
inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
        e.preventDefault();
        handleSend();
    }
});

addMessage('ai', '🔄 VOIDAI initializing...');
init();
</script>
</body>
</html>
