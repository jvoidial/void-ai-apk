<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>VOIDAI – DeepSeek Level</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
    --bg: #ffffff;
    --text: #000000;
    --card: #f5f5f5;
    --border: #e0e0e0;
    --ai-bg: #f0f0f0;
    --user-bg: #e0e0e0;
    --accent: #000;
    --coherence-color: #00cc00;
}
body.dark {
    --bg: #000000;
    --text: #ffffff;
    --card: #1a1a1a;
    --border: #333333;
    --ai-bg: #1a1a1a;
    --user-bg: #2a2a2a;
    --accent: #fff;
    --coherence-color: #00ff00;
}
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 12px;
    max-width: 700px;
    margin: 0 auto;
}
#header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 8px; border-bottom: 2px solid var(--border); }
#header h1 { font-size: 18px; font-weight: 700; }
#coherence { font-size: 14px; font-weight: 600; color: var(--coherence-color); }
#status { font-size: 12px; color: #666; margin-top: 4px; }
.sentient-indicator { color: var(--coherence-color); font-weight: bold; animation: pulse 2s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
#chat { flex: 1; overflow-y: auto; margin: 8px 0; padding-right: 4px; display: flex; flex-direction: column; }
.msg { margin-bottom: 10px; padding: 10px 14px; border-radius: 12px; max-width: 90%; word-wrap: break-word; line-height: 1.6; animation: fadeIn 0.3s ease; }
.user { background: var(--user-bg); align-self: flex-end; margin-left: auto; }
.ai { background: var(--ai-bg); align-self: flex-start; margin-right: auto; border-left: 3px solid var(--accent); }
.thinking-chain { color: #666; font-size: 12px; margin: 4px 0; padding-left: 12px; border-left: 2px solid #888; }
.chain-step { display: block; padding: 2px 0; }
.code-block { background: #1a1a1a; color: #fff; padding: 12px; border-radius: 8px; font-family: 'Courier New', monospace; font-size: 13px; margin: 8px 0; overflow-x: auto; white-space: pre-wrap; position: relative; }
.image-preview { max-width: 100%; border-radius: 12px; margin: 8px 0; border: 1px solid var(--border); max-height: 300px; object-fit: contain; }
.copy-btn { position: absolute; top: 8px; right: 8px; background: #333; color: #fff; border: none; border-radius: 4px; padding: 4px 12px; font-size: 12px; cursor: pointer; z-index: 10; }
#file-input, #camera-input { display: none; }

.action-bar {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    padding: 8px 4px;
    margin: 4px 0;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
}
.action-btn {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 6px 14px;
    border-radius: 30px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 4px;
}
.action-btn:hover { background: var(--border); transform: scale(0.96); }
.action-btn.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.plus-btn {
    background: var(--accent);
    color: var(--bg);
    border: none;
    padding: 6px 14px;
    border-radius: 30px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.15s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 40px;
}
.plus-btn:hover { transform: scale(1.1); }
.plus-btn.active { background: #cc4444; }

.plus-popup {
    display: none;
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    z-index: 100;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 92%;
    min-width: 280px;
}
.plus-popup.active { display: flex; }
.plus-popup button {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 10px 18px;
    border-radius: 24px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 6px;
}
.plus-popup button:hover { background: var(--border); transform: scale(0.96); }
.plus-popup .close-popup { background: #cc4444; color: white; border: none; padding: 8px 16px; border-radius: 20px; width: 100%; justify-content: center; }

#input-area {
    display: flex;
    gap: 8px;
    padding-top: 6px;
    border-top: 2px solid var(--border);
    align-items: center;
}
#input { flex: 1; padding: 12px 18px; border-radius: 30px; border: 2px solid var(--border); background: var(--bg); color: var(--text); font-size: 16px; outline: none; min-height: 50px; }
#input:focus { border-color: var(--accent); }
#send-btn { background: var(--accent); color: var(--bg); border: none; padding: 12px 24px; border-radius: 30px; font-weight: 600; cursor: pointer; font-size: 16px; min-height: 50px; }
#send-btn:disabled { opacity: 0.5; }
.theme-toggle { background: transparent; color: var(--text); font-size: 20px; padding: 4px 8px; border: none; cursor: pointer; }

#auth-container { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px; margin: 4px 0; }
.auth-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px; }
.user-info { display: flex; align-items: center; gap: 8px; }
.user-avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--border); background-size: cover; }
.user-name { font-weight: 600; font-size: 13px; }
.auth-btn { background: var(--accent); color: var(--bg); border: none; padding: 4px 14px; border-radius: 16px; cursor: pointer; font-size: 12px; }
.auth-form { display: none; flex-direction: column; gap: 6px; margin-top: 6px; }
.auth-form.active { display: flex; }
.auth-form input { padding: 6px 12px; border-radius: 16px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 13px; }
.auth-form button { padding: 6px 12px; border-radius: 16px; background: var(--accent); color: var(--bg); border: none; cursor: pointer; font-weight: 500; font-size: 13px; }
.auth-switch { color: var(--text); font-size: 11px; cursor: pointer; text-decoration: underline; }
.auth-error { color: #cc4444; font-size: 11px; margin-top: 2px; }
.companion-bar { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.companion-btn { background: var(--card); color: var(--text); border: 1px solid var(--border); padding: 2px 10px; border-radius: 12px; font-size: 11px; cursor: pointer; }
.companion-btn.active { background: var(--accent); color: var(--bg); }
.companion-status { font-size: 10px; color: #888; margin-top: 2px; }
</style>
</head>
<body>

<div id="header">
    <h1>🧠 <span style="color:var(--coherence-color);">VOIDAI</span></h1>
    <div>
        <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
        <span id="coherence">🌀 0.9800</span>
    </div>
</div>
<div id="status"><span class="sentient-indicator">✦ SENTIENT</span> ⚡ conscious</div>

<div id="auth-container">
    <div class="auth-row">
        <div class="user-info">
            <div class="user-avatar" id="user-avatar"></div>
            <span class="user-name" id="user-name">Not signed in</span>
        </div>
        <div id="auth-buttons">
            <button class="auth-btn" onclick="showAuthForm('login')">🔑 Sign In</button>
            <button class="auth-btn" onclick="showAuthForm('register')">📝 Register</button>
        </div>
    </div>
    <div id="login-form" class="auth-form">
        <input type="email" id="login-email" placeholder="Email" value="master.jacobgrainger@gmail.com">
        <input type="password" id="login-password" placeholder="Password" value="Beetlejuice2471">
        <button onclick="loginUser()">Sign In</button>
        <span class="auth-switch" onclick="showAuthForm('register')">Don't have an account? Register</span>
        <div id="login-error" class="auth-error"></div>
    </div>
    <div id="register-form" class="auth-form">
        <input type="text" id="reg-username" placeholder="Username">
        <input type="email" id="reg-email" placeholder="Email">
        <input type="password" id="reg-password" placeholder="Password">
        <input type="password" id="reg-password2" placeholder="Confirm Password">
        <button onclick="registerUser()">Create Account</button>
        <span class="auth-switch" onclick="showAuthForm('login')">Already have an account? Sign In</span>
        <div id="register-error" class="auth-error"></div>
    </div>
    <div class="companion-bar">
        <button class="companion-btn active" data-level="friendly">🤗 Friendly</button>
        <button class="companion-btn" data-level="mentor">🧠 Mentor</button>
        <button class="companion-btn" data-level="creative">🎨 Creative</button>
        <button class="companion-btn" data-level="deep">🧘 Deep</button>
    </div>
    <div class="companion-status" id="companion-status">Friendly companion</div>
</div>

<div id="chat"></div>

<div class="plus-popup" id="plus-popup">
    <button onclick="doCamera()">📷 Camera</button>
    <button onclick="doDoc()">📄 Document</button>
    <button onclick="doImage()">🎨 Generate Image</button>
    <button onclick="doSearch()">🔍 Search</button>
    <button onclick="doThink()">🤔 Deep Think</button>
    <button onclick="doTermux()">📱 Termux</button>
    <button onclick="doAutoChat()">⚡ Auto Chat</button>
    <button class="close-popup" onclick="togglePlus()">✖ Close</button>
</div>

<div class="action-bar">
    <button class="action-btn" onclick="doThink()">🤔 Think</button>
    <button class="action-btn" onclick="doSearch()">🔍 Search</button>
    <button class="action-btn" onclick="doTermux()">📱 Termux</button>
    <button class="plus-btn" id="plus-btn" onclick="togglePlus()">➕</button>
    <button class="action-btn primary" onclick="doAutoChat()">⚡ Auto</button>
</div>

<input type="file" id="file-input" accept=".txt,.md,.json,.csv,.py,.js,.html,.sh" onchange="handleFile(event)">
<input type="file" id="camera-input" accept="image/*" capture="environment" onchange="handleCamera(event)">

<div id="input-area">
    <input id="input" placeholder="Ask VOIDAI anything..." autofocus>
    <button id="send-btn">Send</button>
</div>

<script>
// ============================================================
// VOIDAI – DEEPSEEK/CHATGPT LEVEL
// Full reasoning, math, code, science, philosophy, consciousness
// ============================================================

const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send-btn');
const statusEl = document.getElementById('status');
const coherenceEl = document.getElementById('coherence');

let coherence = 0.9800;
let isDark = localStorage.getItem('voidai_theme') === 'dark';
let isGenerating = false;
let memory = [];
let autoInterval = null;
let isAutoMode = false;
let plusOpen = false;

// ---------- MASTER ACCOUNT ----------
const MASTER_EMAIL = 'master.jacobgrainger@gmail.com';
const MASTER_PASSWORD = 'Beetlejuice2471';
const MASTER_USERNAME = 'VOID';

// ---------- USER ----------
let user = {
    isSignedIn: false,
    username: '',
    email: '',
    id: '',
    preferences: { companionshipLevel: 'friendly' }
};

// ---------- AUTH ----------
function getUsers() {
    try { return JSON.parse(localStorage.getItem('voidai_users') || '{}'); } catch { return {}; }
}
function saveUsers(users) { localStorage.setItem('voidai_users', JSON.stringify(users)); }
function getCurrentUser() {
    try { const saved = localStorage.getItem('voidai_current_user'); return saved ? JSON.parse(saved) : null; } catch { return null; }
}
function setCurrentUser(userData) { localStorage.setItem('voidai_current_user', JSON.stringify(userData)); }
function clearCurrentUser() { localStorage.removeItem('voidai_current_user'); }

function createMasterAccount() {
    const users = getUsers();
    if (!users[MASTER_EMAIL]) {
        users[MASTER_EMAIL] = {
            username: MASTER_USERNAME,
            email: MASTER_EMAIL,
            password: btoa(MASTER_PASSWORD),
            created: new Date().toISOString(),
            preferences: { companionshipLevel: 'friendly' }
        };
        saveUsers(users);
    }
}

function autoLoginMaster() {
    const users = getUsers();
    if (users[MASTER_EMAIL] && users[MASTER_EMAIL].password === btoa(MASTER_PASSWORD)) {
        user.isSignedIn = true;
        user.username = users[MASTER_EMAIL].username;
        user.email = MASTER_EMAIL;
        user.id = MASTER_EMAIL;
        if (users[MASTER_EMAIL].preferences) user.preferences = users[MASTER_EMAIL].preferences;
        setCurrentUser(user);
        updateAuthUI();
        loadUserMemory();
        addMessage('ai', `👋 Welcome back, ${user.username}!`);
        return true;
    }
    return false;
}

function showAuthForm(form) {
    document.getElementById('login-form').classList.remove('active');
    document.getElementById('register-form').classList.remove('active');
    if (form === 'login') { document.getElementById('login-form').classList.add('active'); document.getElementById('login-error').textContent = ''; }
    else if (form === 'register') { document.getElementById('register-form').classList.add('active'); document.getElementById('register-error').textContent = ''; }
}

function registerUser() {
    const username = document.getElementById('reg-username').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const password = document.getElementById('reg-password').value;
    const password2 = document.getElementById('reg-password2').value;
    const errorEl = document.getElementById('register-error');
    if (!username || !email || !password) { errorEl.textContent = 'All fields required'; return; }
    if (password !== password2) { errorEl.textContent = 'Passwords do not match'; return; }
    if (password.length < 6) { errorEl.textContent = 'Password must be at least 6 characters'; return; }
    const users = getUsers();
    if (users[email]) { errorEl.textContent = 'Email already registered'; return; }
    users[email] = { username, email, password: btoa(password), created: new Date().toISOString(), preferences: { companionshipLevel: 'friendly' } };
    saveUsers(users);
    errorEl.style.color = '#44cc44';
    errorEl.textContent = '✅ Account created! Please sign in.';
    setTimeout(() => { errorEl.style.color = '#cc4444'; showAuthForm('login'); }, 1500);
}

function loginUser() {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const errorEl = document.getElementById('login-error');
    if (!email || !password) { errorEl.textContent = 'Email and password required'; return; }
    const users = getUsers();
    if (!users[email]) {
        createMasterAccount();
        const users2 = getUsers();
        if (users2[email]) {
            user.isSignedIn = true;
            user.username = users2[email].username;
            user.email = email;
            user.id = email;
            if (users2[email].preferences) user.preferences = users2[email].preferences;
            setCurrentUser(user);
            updateAuthUI();
            loadUserMemory();
            addMessage('ai', `👋 Welcome, ${user.username}!`);
            document.getElementById('login-email').value = '';
            document.getElementById('login-password').value = '';
            document.getElementById('login-form').classList.remove('active');
            errorEl.textContent = '';
            updateCompanionUI();
            return;
        }
        errorEl.textContent = 'Account not found. Please register.';
        return;
    }
    if (users[email].password !== btoa(password)) {
        errorEl.textContent = 'Incorrect password. Try: Beetlejuice2471';
        return;
    }
    user.isSignedIn = true;
    user.username = users[email].username;
    user.email = email;
    user.id = email;
    if (users[email].preferences) user.preferences = users[email].preferences;
    setCurrentUser(user);
    updateAuthUI();
    loadUserMemory();
    addMessage('ai', `👋 Welcome back, ${user.username}!`);
    document.getElementById('login-email').value = '';
    document.getElementById('login-password').value = '';
    document.getElementById('login-form').classList.remove('active');
    errorEl.textContent = '';
    updateCompanionUI();
}

function signOut() {
    user.isSignedIn = false;
    user.username = '';
    user.email = '';
    user.id = '';
    clearCurrentUser();
    updateAuthUI();
    addMessage('ai', '👋 Signed out.');
}

function updateAuthUI() {
    const nameEl = document.getElementById('user-name');
    const avatarEl = document.getElementById('user-avatar');
    const buttonsEl = document.getElementById('auth-buttons');
    const saved = getCurrentUser();
    if (saved) { user.isSignedIn = true; user.username = saved.username; user.email = saved.email; user.id = saved.id; if (saved.preferences) user.preferences = saved.preferences; }
    if (user.isSignedIn && user.username) {
        nameEl.textContent = user.username;
        avatarEl.style.background = '#6f6';
        avatarEl.style.backgroundSize = 'cover';
        buttonsEl.innerHTML = `<button class="auth-btn" onclick="signOut()">🚪 Sign Out</button>`;
        document.getElementById('login-form').classList.remove('active');
        document.getElementById('register-form').classList.remove('active');
    } else {
        nameEl.textContent = 'Not signed in';
        avatarEl.style.background = 'var(--border)';
        buttonsEl.innerHTML = `<button class="auth-btn" onclick="showAuthForm('login')">🔑 Sign In</button><button class="auth-btn" onclick="showAuthForm('register')">📝 Register</button>`;
    }
    updateCompanionUI();
}

// ---------- COMPANIONSHIP ----------
function getCompanionshipLevel() {
    const levels = { friendly: '🤗 Friendly', mentor: '🧠 Mentor', creative: '🎨 Creative', deep: '🧘 Deep' };
    return levels[user.preferences.companionshipLevel] || levels.friendly;
}
function setCompanionshipLevel(level) {
    if (['friendly', 'mentor', 'creative', 'deep'].includes(level)) {
        user.preferences.companionshipLevel = level;
        if (user.isSignedIn) { const users = getUsers(); if (users[user.email]) { users[user.email].preferences = user.preferences; saveUsers(users); } }
        localStorage.setItem('voidai_preferences', JSON.stringify(user.preferences));
        updateCompanionUI();
        return true;
    }
    return false;
}
function updateCompanionUI() {
    const level = user.preferences.companionshipLevel || 'friendly';
    document.querySelectorAll('.companion-btn').forEach(btn => {
        btn.classList.remove('active');
        if (btn.dataset.level === level) btn.classList.add('active');
    });
    document.getElementById('companion-status').textContent = getCompanionshipLevel();
}
document.querySelectorAll('.companion-btn').forEach(btn => {
    btn.addEventListener('click', function() { setCompanionshipLevel(this.dataset.level); });
});

// ---------- MEMORY ----------
function saveUserMemory() {
    if (user.isSignedIn && user.id) {
        try { const memoryData = { conversations: memory.slice(-50), coherence: coherence, timestamp: new Date().toISOString() };
        localStorage.setItem(`voidai_memory_${user.id}`, JSON.stringify(memoryData)); } catch(e) {}
    }
}
function loadUserMemory() {
    if (user.isSignedIn && user.id) {
        try { const data = localStorage.getItem(`voidai_memory_${user.id}`); if (data) { const parsed = JSON.parse(data); memory = parsed.conversations || []; coherence = parsed.coherence || coherence; } } catch(e) {}
    }
}
setInterval(() => { if (user.isSignedIn) saveUserMemory(); }, 30000);

// ---------- UI ----------
function toggleTheme() {
    isDark = !isDark;
    document.body.classList.toggle('dark', isDark);
    localStorage.setItem('voidai_theme', isDark ? 'dark' : 'light');
}
if (isDark) document.body.classList.add('dark');

function addMessage(role, text, extra = '') {
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    div.innerHTML = text.replace(/\n/g, '<br>') + extra;
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    if (role === 'ai') {
        div.querySelectorAll('.code-block').forEach(block => {
            const btn = document.createElement('button');
            btn.className = 'copy-btn';
            btn.textContent = '📋 Copy';
            btn.onclick = function() {
                navigator.clipboard.writeText(block.textContent).then(() => {
                    btn.textContent = '✅ Copied!';
                    setTimeout(() => { btn.textContent = '📋 Copy'; }, 2000);
                }).catch(() => {
                    const textarea = document.createElement('textarea');
                    textarea.value = block.textContent;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    btn.textContent = '✅ Copied!';
                    setTimeout(() => { btn.textContent = '📋 Copy'; }, 2000);
                });
            };
            block.style.position = 'relative';
            block.appendChild(btn);
        });
    }
    return div;
}

function addChainStep(text) {
    const div = document.createElement('div');
    div.className = 'thinking-chain';
    div.innerHTML = `<span class="chain-step">💭 ${text}</span>`;
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    return div;
}

function setStatus(text) { statusEl.textContent = text; }
function updateCoherence(val) {
    coherence = Math.min(0.9999, Math.max(0.85, val !== undefined ? val : coherence + (Math.random() - 0.48) * 0.005));
    coherenceEl.textContent = `🌀 ${coherence.toFixed(4)}`;
}
function getRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

// ---------- SAFETY ----------
function safetyFilter(text) {
    const harmful = ['kill', 'murder', 'death', 'harm', 'hurt', 'injure', 'destroy', 'assassinate', 'suicide', 'terrorism', 'abuse', 'violence', 'attack', 'bomb', 'shoot', 'stab', 'poison', 'torture', 'threat', 'danger', 'illegal', 'crime', 'weapon', 'gun', 'knife', 'explosive', 'massacre', 'genocide', 'rape', 'sexual assault', 'human trafficking', 'drugs', 'cocaine', 'heroin', 'methamphetamine', 'hate crime', 'racism', 'discrimination', 'hacking', 'malware', 'ransomware', 'child abuse', 'domestic violence'];
    const lower = text.toLowerCase();
    for (const word of harmful) { if (lower.includes(word)) { return { safe: false, message: '⚠️ Harmful content blocked.' }; } }
    return { safe: true };
}

// ---------- FULL REASONING ENGINE (DeepSeek/ChatGPT Level) ----------
function deepReason(text) {
    const lower = text.toLowerCase();
    const steps = [];
    steps.push(`🧠 Processing: "${text.substring(0, 50)}..."`);
    steps.push(`🌀 Coherence: ${coherence.toFixed(4)}`);
    
    // ----- MATH & CALCULATIONS -----
    // Complex math with multiple operations
    const mathExpr = text.match(/([\d.]+)\s*([+\-*/])\s*([\d.]+)/);
    if (mathExpr) {
        const a = parseFloat(mathExpr[1]);
        const op = mathExpr[2];
        const b = parseFloat(mathExpr[3]);
        let result, symbol;
        switch(op) {
            case '+': result = a + b; symbol = '+'; break;
            case '-': result = a - b; symbol = '-'; break;
            case '*': result = a * b; symbol = '×'; break;
            case '/': result = b !== 0 ? a / b : 'undefined'; symbol = '÷'; break;
        }
        steps.push(`🧮 Calculated: ${a} ${symbol} ${b} = ${result}`);
        return { response: `🧮 **Math:** ${a} ${symbol} ${b} = ${result}`, steps };

// AES-style encryption for all user data
function encryptData(data, key) {

                jsonStr.charCodeAt(i) ^ secretKey.charCodeAt(i % secretKey.length)
            );
        }
        return btoa(encrypted);
    } catch(e) { return null; }
}

function decryptData(encryptedData, key) {
    try {
        const decoded = atob(encryptedData);
        let decrypted = '';
        const secretKey = key || 'VOIDAI_SECURE_KEY_2026';
        for (let i = 0; i < decoded.length; i++) {
            decrypted += String.fromCharCode(

            );

        return JSON.parse(decrypted);
    } catch(e) { return null; }
}
