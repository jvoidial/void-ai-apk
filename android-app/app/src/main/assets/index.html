<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VOIDAI</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/atom-one-dark.min.css">
<style>
*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0;
  background: #000;
  color: #ededed;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  height: 100%;
  overflow: hidden;
}

#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  max-width: 720px;
  margin: 0 auto;
  padding: 0 16px;
}

#hero {
  flex-shrink: 0;
  text-align: center;
  font-size: 40px;
  font-weight: 300;
  letter-spacing: -0.04em;
  color: #2a2a2a;
  margin: 28px 0 16px 0;
  transition: all 0.3s;
  font-family: -apple-system, "SF Pro Display", system-ui, sans-serif;
}
#hero.small { font-size: 16px; color: #555; margin: 12px 0 8px 0; }

#messages {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0 20px 0;
  -webkit-overflow-scrolling: touch;
}

.msg { padding: 10px 0; animation: fade 0.25s ease-out; }
@keyframes fade {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: translateY(0); }
}

.msg .label {
  font-size: 10px;
  color: #4d4d4d;
  letter-spacing: 0.1em;
  margin-bottom: 5px;
  font-family: ui-monospace, "SF Mono", monospace;
  text-transform: uppercase;
}
.msg .text { color: #ededed; font-size: 15px; line-height: 1.65; word-wrap: break-word; }
.msg.user .text { color: #a0a0a0; }

.msg .copy {
  float: right;
  font-size: 9px;
  color: #4d4d4d;
  cursor: pointer;
  padding: 1px 6px;
  border: 1px solid #1a1a1a;
  border-radius: 4px;
  letter-spacing: 0.1em;
}
.msg .copy:hover { color: #fff; border-color: #333; }

.text h1 { font-size: 20px; font-weight: 600; color: #fff; margin: 14px 0 6px; }
.text h2 { font-size: 17px; font-weight: 600; color: #ededed; margin: 12px 0 5px; }
.text h3 { font-size: 15px; font-weight: 600; color: #ededed; margin: 10px 0 4px; }
.text ul { margin: 8px 0; padding-left: 22px; }
.text li { margin: 4px 0; }
.text p { margin: 8px 0; }

.text pre {
  background: #0a0a0a;
  border: 1px solid #1a1a1a;
  border-radius: 8px;
  padding: 12px 14px;
  overflow-x: auto;
  font-family: ui-monospace, monospace;
  font-size: 13px;
  line-height: 1.5;
  margin: 10px 0;
  color: #d0d0d0;
}
.text code {
  background: #0a0a0a;
  padding: 2px 6px;
  border-radius: 4px;
  font-family: ui-monospace, monospace;
  font-size: 13px;
  color: #d0d0d0;
}
.text pre code { background: none; padding: 0; }

.dots { display: flex; gap: 5px; padding: 6px 0; }
.dots span {
  width: 7px; height: 7px; border-radius: 50%;
  background: #4d4d4d;
  animation: dot 1.3s infinite ease-in-out;
}
.dots span:nth-child(2) { animation-delay: 0.18s; }
.dots span:nth-child(3) { animation-delay: 0.36s; }
@keyframes dot {
  0%, 80%, 100% { opacity: 0.25; transform: scale(0.7); }
  40% { opacity: 1; transform: scale(1); }
}

#dock {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  background: #0a0a0a;
  border: 1px solid #1f1f1f;
  border-radius: 28px;
  padding: 6px 6px 6px 20px;
  margin-bottom: 16px;
}

#input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: #ededed;
  font-size: 15px;
  font-family: inherit;
  padding: 14px 0;
  caret-color: #fff;
  min-width: 0;
}
#input::placeholder { color: #4d4d4d; }
#input:disabled { opacity: 0.5; }

#send {
  width: 44px; height: 44px;
  border-radius: 50%;
  background: #fff;
  border: none;
  color: #000;
  font-size: 20px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  line-height: 1;
  padding: 0;
  transition: background 0.12s;
}
#send:active { background: #d4d4d4; }
#send:disabled { opacity: 0.3; }

#status {
  flex-shrink: 0;
  text-align: center;
  font-size: 10px;
  color: #4d4d4d;
  font-family: ui-monospace, monospace;
  padding-bottom: 10px;
  letter-spacing: 0.05em;
  min-height: 20px;
}
</style>
</head>
<body>

<div id="app">
  <div id="hero">VOIDAI</div>
  <div id="signin-bar" style="position:absolute; top:12px; right:16px; z-index:10;">
    <button id="signin-btn" onclick="voidaiSignIn()" style="background:#fff;border:none;color:#000;padding:6px 12px;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;">Sign in</button>
  </div>
  <div id="auth-bar" style="display:none; position:absolute; top:12px; right:16px; z-index:10; align-items:center; gap:8px;">
    <span id="user-display" style="font-size:11px; color:#888; font-family:ui-monospace,monospace;"></span>
    <button id="signout-btn" onclick="voidaiSignOut()" style="background:transparent;border:1px solid #1f1f1f;color:#888;padding:4px 8px;border-radius:6px;font-size:10px;cursor:pointer;font-family:inherit;">Sign out</button>
  </div>

  <div id="messages"></div>
  <div id="status">connecting…</div>
  <div id="dock">
    <input id="input" type="text" placeholder="Ask anything..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <button id="send" aria-label="Send">↑</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/common.min.js"></script>







</div>












<!-- ═══════════════ VOIDAI SIDEBAR — clean install ═══════════════ -->
<style>
  #voidai-menu-btn { position: fixed !important; top: 12px !important; left: 12px !important;
    z-index: 2147483647 !important; width: 40px; height: 40px;
    background: #1a1a1a; border: 1px solid #333; color: #fff;
    border-radius: 8px; font-size: 18px; line-height: 1;
    cursor: pointer; display: flex; align-items: center; justify-content: center; }
  #voidai-menu-btn:active { background: #333; }
  #voidai-sidebar { position: fixed !important; top: 0 !important; left: -320px !important;
    bottom: 0 !important; width: 300px; max-width: 85vw;
    background: #0b0b0b !important; border-right: 1px solid #222;
    z-index: 2147483646 !important; transition: left 0.22s ease;
    padding: 16px; overflow-y: auto; box-sizing: border-box;
    font-family: ui-monospace, monospace; color: #ccc; }
  #voidai-sidebar.open { left: 0 !important; }
  #voidai-sidebar h3 { margin: 8px 0 12px; font-size: 11px; letter-spacing: 2px; color: #666; font-weight: 600; }
  #voidai-new-btn { display: block; width: 100%; box-sizing: border-box;
    background: #1a1a1a; border: 1px solid #333; color: #fff;
    padding: 9px; border-radius: 6px; font-size: 11px; cursor: pointer;
    margin-bottom: 14px; font-family: inherit; }
  #voidai-new-btn:active { background: #333; }
  .voidai-conv { padding: 9px 10px; margin-bottom: 5px; background: #141414;
    border: 1px solid #222; border-radius: 6px; cursor: pointer;
    color: #ccc; font-size: 12px; }
  .voidai-conv.active { border-color: #4a8; background: #12201a; }
  .voidai-conv:active { background: #1e1e1e; }
  .voidai-conv .conv-title { font-weight: 600; margin-bottom: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .voidai-conv .conv-meta { font-size: 10px; color: #666; }
  .voidai-empty { color: #555; padding: 10px 4px; font-size: 11px; font-style: italic; }
</style>

<button id="voidai-menu-btn" type="button">&#9776;</button>

<div id="voidai-sidebar">
  <h3>CONVERSATIONS</h3>
  <button id="voidai-new-btn" type="button">+ New conversation</button>
  <div id="voidai-conv-list"></div>
</div>

<script>
(function(){
  'use strict';

  // ── State ──
  var convs = [];
  var activeId = null;
  try { convs = JSON.parse(localStorage.getItem('voidai_convs') || '[]'); } catch(e) { convs = []; }
  try { activeId = localStorage.getItem('voidai_active_conv'); } catch(e) {}

  function persist() {
    try {
      localStorage.setItem('voidai_convs', JSON.stringify(convs));
      localStorage.setItem('voidai_active_conv', activeId || '');
    } catch(e) {}
  }

  function findMessagesEl() {
    return document.getElementById('messages')
        || document.getElementById('chat')
        || document.querySelector('.messages')
        || document.querySelector('main');
  }

  function appHistory() {
    // The app defines `history` as a bare variable; walk the chain
    try { if (typeof history !== 'undefined' && Array.isArray(history)) return history; } catch(e) {}
    try { if (window.history && Array.isArray(window.history)) return window.history; } catch(e) {}
    return null;
  }

  function clearAppHistory() {
    var h = appHistory();
    if (h) { while (h.length > 0) h.pop(); }
  }

  // ── Render ──
  function renderList() {
    var list = document.getElementById('voidai-conv-list');
    if (!list) return;
    if (!convs.length) {
      list.innerHTML = '<div class="voidai-empty">No conversations yet</div>';
      return;
    }
    var html = '';
    for (var i = 0; i < convs.length; i++) {
      var c = convs[i];
      var cls = 'voidai-conv' + (c.id === activeId ? ' active' : '');
      var n = (c.messages && c.messages.length) || 0;
      html += '<div class="' + cls + '" data-conv-id="' + c.id + '">' +
                '<div class="conv-title">' + (c.title || 'Untitled') + '</div>' +
                '<div class="conv-meta">' + n + ' msgs</div>' +
              '</div>';
    }
    list.innerHTML = html;
  }

  // ── Actions ──
  function toggleSidebar() {
    var sb = document.getElementById('voidai-sidebar');
    if (!sb) return;
    if (sb.classList.contains('open')) {
      sb.classList.remove('open');
    } else {
      renderList();
      sb.classList.add('open');
    }
  }

  function newConversation() {
    var id = 'c' + Date.now();
    convs.unshift({ id: id, title: 'New chat', messages: [], created: Date.now() });
    activeId = id;
    persist();
    var m = findMessagesEl();
    if (m) m.innerHTML = '';
    clearAppHistory();
    renderList();
    var sb = document.getElementById('voidai-sidebar');
    if (sb) sb.classList.remove('open');
  }

  function switchConversation(id) {
    activeId = id;
    persist();
    var c = null;
    for (var i = 0; i < convs.length; i++) { if (convs[i].id === id) { c = convs[i]; break; } }
    if (!c) return;
    var m = findMessagesEl();
    if (!m) return;
    m.innerHTML = '';
    clearAppHistory();
    var msgs = c.messages || [];
    for (var j = 0; j < msgs.length; j++) {
      try { if (typeof addMsg === 'function') addMsg(msgs[j].role, msgs[j].content, true); } catch(e) {}
      var h = appHistory();
      if (h) h.push({ role: msgs[j].role, content: msgs[j].content });
    }
    renderList();
    var sb = document.getElementById('voidai-sidebar');
    if (sb) sb.classList.remove('open');
  }

  function saveCurrent() {
    var h = appHistory();
    if (!h || !h.length) return;
    if (!activeId) {
      activeId = 'c' + Date.now();
      convs.unshift({ id: activeId, title: 'New chat', messages: [], created: Date.now() });
    }
    var c = null;
    for (var i = 0; i < convs.length; i++) { if (convs[i].id === activeId) { c = convs[i]; break; } }
    if (!c) return;
    c.messages = h.slice();
    if ((!c.title || c.title === 'New chat') && h[0] && h[0].role === 'user') {
      c.title = h[0].content.slice(0, 28);
    }
    persist();
    renderList();
  }

  // ── Event delegation: survives any DOM rebuild ──
  function handleTap(e) {
    var t = e.target;
    while (t && t !== document && t !== window) {
      if (t.id === 'voidai-menu-btn')  { e.preventDefault(); e.stopPropagation(); toggleSidebar(); return; }
      if (t.id === 'voidai-new-btn')   { e.preventDefault(); e.stopPropagation(); newConversation(); return; }
      if (t.getAttribute && t.getAttribute('data-conv-id')) {
        e.preventDefault(); e.stopPropagation();
        switchConversation(t.getAttribute('data-conv-id'));
        return;
      }
      t = t.parentNode;
    }
  }

  document.addEventListener('click',    handleTap, true);
  document.addEventListener('touchend', handleTap, true);

  // ── Auto-save when messages appear ──
  function attachObserver() {
    var m = findMessagesEl();
    if (!m || m.__voidaiObs) return;
    m.__voidaiObs = true;
    var obs = new MutationObserver(function(){ setTimeout(saveCurrent, 400); });
    obs.observe(m, { childList: true, subtree: true });
  }

  // ── Re-append sidebar/button if the app's DOM wipes them (e.g. sign-in) ──
  function ensurePresent() {
    var btn = document.getElementById('voidai-menu-btn');
    if (!btn) {
      btn = document.createElement('button');
      btn.id = 'voidai-menu-btn';
      btn.type = 'button';
      btn.innerHTML = '&#9776;';
      document.body.appendChild(btn);
    }
    var sb = document.getElementById('voidai-sidebar');
    if (!sb) {
      sb = document.createElement('div');
      sb.id = 'voidai-sidebar';
      sb.innerHTML = '<h3>CONVERSATIONS</h3>' +
        '<button id="voidai-new-btn" type="button">+ New conversation</button>' +
        '<div id="voidai-conv-list"></div>';
      document.body.appendChild(sb);
    }
    renderList();
  }

  function boot() {
    ensurePresent();
    attachObserver();
  }

  // Observe body for structural changes (sign-in rebuild, etc.)
  try {
    var bodyObs = new MutationObserver(function(){ ensurePresent(); attachObserver(); });
    bodyObs.observe(document.body, { childList: true, subtree: false });
  } catch(e) {}

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
  setTimeout(boot, 500);
  setTimeout(boot, 1500);
  setTimeout(boot, 3000);

  // Expose for debugging
  window.voidaiToggleSidebar = toggleSidebar;
  window.voidaiNewConversation = newConversation;
  window.voidaiSwitchConv = switchConversation;
  window.voidaiSaveConv = saveCurrent;
})();
</script>
<!-- ═══════════════ /VOIDAI SIDEBAR ═══════════════ -->

</body>
</html>
