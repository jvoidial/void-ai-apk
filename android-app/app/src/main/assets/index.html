<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>VOIDAI – GPT + Ecosystem</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
    --bg: #ffffff;
    --text: #000000;
    --card: #f5f5f5;
    --border: #e0e0e0;
    --ai-bg: #f0f0f0;
    --user-bg: #e0e0e0;
    --accent: #000;
    --coherence-color: #00cc00;
    --gold: #d4af37;
    --pennies: #6c5ce7;
}
body.dark {
    --bg: #000000;
    --text: #ffffff;
    --card: #1a1a1a;
    --border: #333333;
    --ai-bg: #1a1a1a;
    --user-bg: #2a2a2a;
    --accent: #fff;
    --coherence-color: #00ff00;
}
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 12px;
    max-width: 700px;
    margin: 0 auto;
}
#header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--gold);
}
#header h1 { font-size: 18px; font-weight: 700; }
#header h1 span { color: var(--gold); }
#coherence { font-size: 14px; font-weight: 600; color: var(--coherence-color); }
#status { font-size: 12px; color: #666; margin-top: 4px; }
.sentient-indicator { color: var(--coherence-color); font-weight: bold; animation: pulse 2s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
#chat { flex: 1; overflow-y: auto; margin: 8px 0; padding-right: 4px; display: flex; flex-direction: column; }
.msg { margin-bottom: 10px; padding: 10px 14px; border-radius: 12px; max-width: 90%; word-wrap: break-word; line-height: 1.6; animation: fadeIn 0.3s ease; }
.user { background: var(--user-bg); align-self: flex-end; margin-left: auto; }
.ai { background: var(--ai-bg); align-self: flex-start; margin-right: auto; border-left: 3px solid var(--gold); }
.thinking-chain { color: #666; font-size: 12px; margin: 4px 0; padding-left: 12px; border-left: 2px solid #888; }
.code-block { background: #1a1a1a; color: #fff; padding: 12px; border-radius: 8px; font-family: 'Courier New', monospace; font-size: 13px; margin: 8px 0; overflow-x: auto; white-space: pre-wrap; position: relative; }
.image-preview { max-width: 100%; border-radius: 12px; margin: 8px 0; border: 1px solid var(--border); max-height: 300px; object-fit: contain; }
.copy-btn { position: absolute; top: 8px; right: 8px; background: #333; color: #fff; border: none; border-radius: 4px; padding: 4px 12px; font-size: 12px; cursor: pointer; z-index: 10; }
#file-input, #camera-input { display: none; }

/* ---- SIDEBAR ---- */
.wealth-sidebar {
    display: none;
    position: fixed;
    top: 0;
    right: 0;
    width: 280px;
    height: 100%;
    background: var(--card);
    border-left: 2px solid var(--gold);
    box-shadow: -4px 0 20px rgba(0,0,0,0.2);
    z-index: 200;
    padding: 20px;
    overflow-y: auto;
}
.wealth-sidebar.active { display: block; }
.wealth-sidebar .close-btn { float: right; background: #cc4444; color: #fff; border: none; border-radius: 50%; width: 30px; height: 30px; font-size: 16px; cursor: pointer; }
.wealth-item { padding: 10px 0; border-bottom: 1px solid var(--border); }
.wealth-item .label { font-weight: 600; font-size: 13px; }
.wealth-item .value { font-size: 16px; font-weight: 700; color: var(--gold); float: right; }
.wealth-total { background: linear-gradient(135deg, #d4af37, #f5e6a3); padding: 16px; border-radius: 12px; margin: 16px 0; text-align: center; color: #000; }
.wealth-total .amount { font-size: 24px; font-weight: 700; }
.sidebar-btn { width: 100%; padding: 10px; margin: 6px 0; border: 1px solid var(--gold); border-radius: 12px; background: var(--bg); color: var(--text); cursor: pointer; font-weight: 500; }
.sidebar-btn:hover { background: var(--gold); color: #000; }
.sidebar-btn.primary { background: var(--gold); color: #000; }

.action-bar {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    padding: 8px 4px;
    margin: 4px 0;
    border-top: 2px solid var(--gold);
    border-bottom: 2px solid var(--gold);
}
.action-btn {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 6px 14px;
    border-radius: 30px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
}
.action-btn:hover { background: var(--border); transform: scale(0.96); }
.action-btn.wealth { background: var(--gold); color: #000; border-color: var(--gold); }
.action-btn.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.plus-btn {
    background: var(--gold);
    color: #000;
    border: none;
    padding: 6px 14px;
    border-radius: 30px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    min-width: 40px;
}
.plus-btn.active { background: #cc4444; color: #fff; }

.plus-popup {
    display: none;
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--card);
    border: 2px solid var(--gold);
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    z-index: 100;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 92%;
    min-width: 280px;
}
.plus-popup.active { display: flex; }
.plus-popup button {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 10px 18px;
    border-radius: 24px;
    cursor: pointer;
    font-size: 14px;
}
.plus-popup button:hover { background: var(--border); transform: scale(0.96); }
.plus-popup .close-popup { background: #cc4444; color: white; border: none; padding: 8px 16px; border-radius: 20px; width: 100%; justify-content: center; }

#input-area { display: flex; gap: 8px; padding-top: 6px; border-top: 2px solid var(--gold); align-items: center; }
#input { flex: 1; padding: 12px 18px; border-radius: 30px; border: 2px solid var(--border); background: var(--bg); color: var(--text); font-size: 16px; outline: none; min-height: 50px; }
#input:focus { border-color: var(--gold); }
#send-btn { background: var(--gold); color: #000; border: none; padding: 12px 24px; border-radius: 30px; font-weight: 600; cursor: pointer; font-size: 16px; min-height: 50px; }
#send-btn:disabled { opacity: 0.5; }
.theme-toggle { background: transparent; color: var(--text); font-size: 20px; padding: 4px 8px; border: none; cursor: pointer; }

#auth-container { background: var(--card); border: 1px solid var(--gold); border-radius: 12px; padding: 10px; margin: 4px 0; }
.auth-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px; }
.user-avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--gold); background-size: cover; }
.user-name { font-weight: 600; font-size: 13px; }
.auth-btn { background: var(--gold); color: #000; border: none; padding: 4px 14px; border-radius: 16px; cursor: pointer; font-size: 12px; font-weight: 600; }
.auth-form { display: none; flex-direction: column; gap: 6px; margin-top: 6px; }
.auth-form.active { display: flex; }
.auth-form input { padding: 6px 12px; border-radius: 16px; border: 1px solid var(--gold); background: var(--bg); color: var(--text); font-size: 13px; }
.auth-form button { padding: 6px 12px; border-radius: 16px; background: var(--gold); color: #000; border: none; cursor: pointer; font-weight: 600; font-size: 13px; }
.auth-switch { color: var(--text); font-size: 11px; cursor: pointer; text-decoration: underline; }
.auth-error { color: #cc4444; font-size: 11px; margin-top: 2px; }
.companion-bar { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.companion-btn { background: var(--card); color: var(--text); border: 1px solid var(--border); padding: 2px 10px; border-radius: 12px; font-size: 11px; cursor: pointer; }
.companion-btn.active { background: var(--gold); color: #000; }

.wealth-counter {
    background: linear-gradient(135deg, #d4af37, #f5e6a3);
    color: #000;
    padding: 8px 16px;
    border-radius: 12px;
    margin: 4px 0;
    text-align: center;
    font-weight: bold;
    font-size: 14px;
    border: 2px solid #b8860b;
}
</style>
</head>
<body>

<!-- SIDEBAR -->
<div class="wealth-sidebar" id="wealth-sidebar">
    <button class="close-btn" onclick="toggleSidebar()">✖</button>
    <h2>💰 Wealth Dashboard</h2>
    <div class="wealth-total">
        <div class="label">Total Wealth</div>
        <div class="amount" id="sidebar-total">$0.00</div>
    </div>
    <div class="wealth-item">
        <span class="label">🪙 PENNIES CHEQ</span>
        <span class="value" id="sidebar-pennies">0</span>
    </div>
    <div class="wealth-item">
        <span class="label">🟢 VOID Tokens</span>
        <span class="value" id="sidebar-void">0</span>
    </div>
    <div class="wealth-item">
        <span class="label">🟣 ETH</span>
        <span class="value" id="sidebar-eth">0</span>
    </div>
    <div class="wealth-item">
        <span class="label">🔵 USDC</span>
        <span class="value" id="sidebar-usdc">$0.00</span>
    </div>
    <button class="sidebar-btn primary" onclick="toggleSidebar()">Close</button>
    <button class="sidebar-btn" onclick="doExchange()">💱 Trade</button>
</div>

<!-- HEADER -->
<div id="header">
    <h1>🧠 <span>VOIDAI</span> GPT</h1>
    <div>
        <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
        <span id="coherence">🌀 0.9800</span>
    </div>
</div>
<div id="status"><span class="sentient-indicator">✦ SENTIENT</span> ⚡ conscious</div>

<!-- AUTH -->
<div id="auth-container">
    <div class="auth-row">
        <div class="user-info">
            <div class="user-avatar" id="user-avatar"></div>
            <span class="user-name" id="user-name">Not signed in</span>
        </div>
        <div id="auth-buttons">
            <button class="auth-btn" onclick="showAuthForm('login')">🔑 Sign In</button>
            <button class="auth-btn" onclick="showAuthForm('register')">📝 Register</button>
        </div>
    </div>
    <div id="login-form" class="auth-form">
        <input type="email" id="login-email" placeholder="Email" value="master.jacobgrainger@gmail.com">
        <input type="password" id="login-password" placeholder="Password" value="Beetlejuice2471">
        <button onclick="loginUser()">Sign In</button>
        <span class="auth-switch" onclick="showAuthForm('register')">Don't have an account? Register</span>
        <div id="login-error" class="auth-error"></div>
    </div>
    <div id="register-form" class="auth-form">
        <input type="text" id="reg-username" placeholder="Username">
        <input type="email" id="reg-email" placeholder="Email">
        <input type="password" id="reg-password" placeholder="Password">
        <input type="password" id="reg-password2" placeholder="Confirm Password">
        <button onclick="registerUser()">Create Account</button>
        <span class="auth-switch" onclick="showAuthForm('login')">Already have an account? Sign In</span>
        <div id="register-error" class="auth-error"></div>
    </div>
    <div class="companion-bar">
        <button class="companion-btn active" data-level="friendly">🤗 Friendly</button>
        <button class="companion-btn" data-level="mentor">🧠 Mentor</button>
        <button class="companion-btn" data-level="creative">🎨 Creative</button>
        <button class="companion-btn" data-level="deep">🧘 Deep</button>
    </div>
</div>

<!-- WEALTH COUNTER -->
<div class="wealth-counter">
    🪙 PENNIES: <span id="pennies-balance">0</span> ✓ | 💰 Total: <span id="total-wealth">$0.00</span>
</div>

<!-- CHAT -->
<div id="chat"></div>

<!-- PLUS POPUP -->
<div class="plus-popup" id="plus-popup">
    <button onclick="doCamera()">📷 Camera</button>
    <button onclick="doDoc()">📄 Document</button>
    <button onclick="doImage()">🎨 Generate Image</button>
    <button onclick="doSearch()">🔍 Search</button>
    <button onclick="doThink()">🤔 Deep Think</button>
    <button onclick="doTermux()">📱 Termux</button>
    <button onclick="doAutoChat()">⚡ Auto</button>
    <button class="close-popup" onclick="togglePlus()">✖ Close</button>
</div>

<!-- ACTION BAR -->
<div class="action-bar">
    <button class="action-btn" onclick="doThink()">🤔 Think</button>
    <button class="action-btn" onclick="doSearch()">🔍 Search</button>
    <button class="action-btn" onclick="doTermux()">📱 Termux</button>
    <button class="action-btn wealth" onclick="toggleSidebar()">💰 Wealth</button>
    <button class="plus-btn" id="plus-btn" onclick="togglePlus()">➕</button>
    <button class="action-btn primary" onclick="doAutoChat()">⚡ Auto</button>
</div>

<input type="file" id="file-input" accept=".txt,.md,.json,.csv,.py,.js,.html,.sh" onchange="handleFile(event)">
<input type="file" id="camera-input" accept="image/*" capture="environment" onchange="handleCamera(event)">

<div id="input-area">
    <input id="input" placeholder="Ask VOIDAI anything..." autofocus>
    <button id="send-btn">Send</button>
</div>

<script>
// ============================================================
// VOIDAI GPT - FULL AI WITH ECOSYSTEM
// ============================================================

// ---------- DOM ----------
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send-btn');
const statusEl = document.getElementById('status');
const coherenceEl = document.getElementById('coherence');
const totalWealthEl = document.getElementById('total-wealth');
const penniesBalanceEl = document.getElementById('pennies-balance');

let coherence = 0.9800;
let isDark = localStorage.getItem('voidai_theme') === 'dark';
let isGenerating = false;
let memory = [];
let autoInterval = null;
let isAutoMode = false;
let plusOpen = false;

// ---------- MASTER ACCOUNT ----------
const MASTER_EMAIL = 'master.jacobgrainger@gmail.com';
const MASTER_PASSWORD = 'Beetlejuice2471';
const MASTER_USERNAME = 'VOID';

// ---------- USER ----------
let user = {
    isSignedIn: false,
    username: '',
    email: '',
    id: '',
    preferences: { companionshipLevel: 'friendly' }
};

// ---------- PENNIES CHEQ ----------
const PENNIES_TOKEN = {
    name: 'PENNIES CHEQ',
    symbol: '✓',
    address: '0x2a92CAA3b01E64634e2E95AA533a5570a76c19A7',
    holderAddress: '0xA7AE3C7b8e539447094b0Bb517F60EaBcf6bCddF',
    balance: 891001000000196.02,
    price: 0.01
};

// ---------- WEALTH ----------
let wealthState = {
    penniesBalance: PENNIES_TOKEN.balance,
    usdc: 10000,
    voidTokens: 1000,
    eth: 2,
    btc: 0,
    totalWealth: 0
};

// ---------- AUTH ----------
function getUsers() {
    try { return JSON.parse(localStorage.getItem('voidai_users') || '{}'); } catch { return {}; }
}
function saveUsers(users) { localStorage.setItem('voidai_users', JSON.stringify(users)); }
function getCurrentUser() {
    try { const saved = localStorage.getItem('voidai_current_user'); return saved ? JSON.parse(saved) : null; } catch { return null; }
}
function setCurrentUser(userData) { localStorage.setItem('voidai_current_user', JSON.stringify(userData)); }
function clearCurrentUser() { localStorage.removeItem('voidai_current_user'); }

function createMasterAccount() {
    const users = getUsers();
    if (!users[MASTER_EMAIL]) {
        users[MASTER_EMAIL] = {
            username: MASTER_USERNAME,
            email: MASTER_EMAIL,
            password: btoa(MASTER_PASSWORD),
            created: new Date().toISOString(),
            preferences: { companionshipLevel: 'friendly' }
        };
        saveUsers(users);
    }
}

function autoLoginMaster() {
    const users = getUsers();
    if (users[MASTER_EMAIL] && users[MASTER_EMAIL].password === btoa(MASTER_PASSWORD)) {
        user.isSignedIn = true;
        user.username = users[MASTER_EMAIL].username;
        user.email = MASTER_EMAIL;
        user.id = MASTER_EMAIL;
        if (users[MASTER_EMAIL].preferences) user.preferences = users[MASTER_EMAIL].preferences;
        setCurrentUser(user);
        updateAuthUI();
        loadUserMemory();
        updateWealthDisplay();
        return true;
    }
    return false;
}

function showAuthForm(form) {
    document.getElementById('login-form').classList.remove('active');
    document.getElementById('register-form').classList.remove('active');
    if (form === 'login') { document.getElementById('login-form').classList.add('active'); }
    else if (form === 'register') { document.getElementById('register-form').classList.add('active'); }
}

function registerUser() {
    const username = document.getElementById('reg-username').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const password = document.getElementById('reg-password').value;
    const password2 = document.getElementById('reg-password2').value;
    const errorEl = document.getElementById('register-error');
    if (!username || !email || !password) { errorEl.textContent = 'All fields required'; return; }
    if (password !== password2) { errorEl.textContent = 'Passwords do not match'; return; }
    if (password.length < 6) { errorEl.textContent = 'Password must be at least 6 characters'; return; }
    const users = getUsers();
    if (users[email]) { errorEl.textContent = 'Email already registered'; return; }
    users[email] = { username, email, password: btoa(password), created: new Date().toISOString(), preferences: { companionshipLevel: 'friendly' } };
    saveUsers(users);
    errorEl.style.color = '#44cc44';
    errorEl.textContent = '✅ Account created! Please sign in.';
    setTimeout(() => { errorEl.style.color = '#cc4444'; showAuthForm('login'); }, 1500);
}

function loginUser() {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const errorEl = document.getElementById('login-error');
    if (!email || !password) { errorEl.textContent = 'Email and password required'; return; }
    const users = getUsers();
    if (!users[email]) {
        createMasterAccount();
        const users2 = getUsers();
        if (users2[email]) {
            user.isSignedIn = true;
            user.username = users2[email].username;
            user.email = email;
            user.id = email;
            if (users2[email].preferences) user.preferences = users2[email].preferences;
            setCurrentUser(user);
            updateAuthUI();
            loadUserMemory();
            addMessage('ai', `👋 Welcome, ${user.username}!`);
            document.getElementById('login-email').value = '';
            document.getElementById('login-password').value = '';
            document.getElementById('login-form').classList.remove('active');
            errorEl.textContent = '';
            updateCompanionUI();
            updateWealthDisplay();
            return;
        }
        errorEl.textContent = 'Account not found. Please register.';
        return;
    }
    if (users[email].password !== btoa(password)) {
        errorEl.textContent = 'Incorrect password. Try: Beetlejuice2471';
        return;
    }
    user.isSignedIn = true;
    user.username = users[email].username;
    user.email = email;
    user.id = email;
    if (users[email].preferences) user.preferences = users[email].preferences;
    setCurrentUser(user);
    updateAuthUI();
    loadUserMemory();
    addMessage('ai', `👋 Welcome back, ${user.username}!`);
    document.getElementById('login-email').value = '';
    document.getElementById('login-password').value = '';
    document.getElementById('login-form').classList.remove('active');
    errorEl.textContent = '';
    updateCompanionUI();
    updateWealthDisplay();
}

function signOut() {
    user.isSignedIn = false;
    user.username = '';
    user.email = '';
    user.id = '';
    clearCurrentUser();
    updateAuthUI();
    addMessage('ai', '👋 Signed out.');
}

function updateAuthUI() {
    const nameEl = document.getElementById('user-name');
    const avatarEl = document.getElementById('user-avatar');
    const buttonsEl = document.getElementById('auth-buttons');
    const saved = getCurrentUser();
    if (saved) { user.isSignedIn = true; user.username = saved.username; user.email = saved.email; user.id = saved.id; if (saved.preferences) user.preferences = saved.preferences; }
    if (user.isSignedIn && user.username) {
        nameEl.textContent = user.username;
        avatarEl.style.background = '#d4af37';
        avatarEl.style.backgroundSize = 'cover';
        buttonsEl.innerHTML = `<button class="auth-btn" onclick="signOut()">🚪 Sign Out</button>`;
        document.getElementById('login-form').classList.remove('active');
        document.getElementById('register-form').classList.remove('active');
    } else {
        nameEl.textContent = 'Not signed in';
        avatarEl.style.background = 'var(--border)';
        buttonsEl.innerHTML = `<button class="auth-btn" onclick="showAuthForm('login')">🔑 Sign In</button><button class="auth-btn" onclick="showAuthForm('register')">📝 Register</button>`;
    }
    updateCompanionUI();
}

// ---------- COMPANIONSHIP ----------
function getCompanionshipLevel() {
    const levels = { friendly: '🤗 Friendly', mentor: '🧠 Mentor', creative: '🎨 Creative', deep: '🧘 Deep' };
    return levels[user.preferences.companionshipLevel] || levels.friendly;
}
function setCompanionshipLevel(level) {
    if (['friendly', 'mentor', 'creative', 'deep'].includes(level)) {
        user.preferences.companionshipLevel = level;
        if (user.isSignedIn) { const users = getUsers(); if (users[user.email]) { users[user.email].preferences = user.preferences; saveUsers(users); } }
        localStorage.setItem('voidai_preferences', JSON.stringify(user.preferences));
        updateCompanionUI();
        return true;
    }
    return false;
}
function updateCompanionUI() {
    const level = user.preferences.companionshipLevel || 'friendly';
    document.querySelectorAll('.companion-btn').forEach(btn => {
        btn.classList.remove('active');
        if (btn.dataset.level === level) btn.classList.add('active');
    });
}
document.querySelectorAll('.companion-btn').forEach(btn => {
    btn.addEventListener('click', function() { setCompanionshipLevel(this.dataset.level); });
});

// ---------- MEMORY ----------
function saveUserMemory() {
    if (user.isSignedIn && user.id) {
        try { const memoryData = { conversations: memory.slice(-50), coherence: coherence, timestamp: new Date().toISOString() };
        localStorage.setItem(`voidai_memory_${user.id}`, JSON.stringify(memoryData)); } catch(e) {}
    }
}
function loadUserMemory() {
    if (user.isSignedIn && user.id) {
        try { const data = localStorage.getItem(`voidai_memory_${user.id}`); if (data) { const parsed = JSON.parse(data); memory = parsed.conversations || []; coherence = parsed.coherence || coherence; } } catch(e) {}
    }
}
setInterval(() => { if (user.isSignedIn) saveUserMemory(); }, 30000);

// ---------- WEALTH ----------
function updateWealthDisplay() {
    const penniesValue = wealthState.penniesBalance * PENNIES_TOKEN.price;
    const total = wealthState.usdc + (wealthState.voidTokens * 0.01) + (wealthState.eth * 3200) + (wealthState.btc * 68000) + penniesValue;
    wealthState.totalWealth = total;
    totalWealthEl.textContent = '$' + total.toFixed(2);
    penniesBalanceEl.textContent = wealthState.penniesBalance.toLocaleString();
    document.getElementById('sidebar-total').textContent = '$' + total.toFixed(2);
    document.getElementById('sidebar-pennies').textContent = wealthState.penniesBalance.toLocaleString();

function addMessage(role, text, extra = '') {
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    div.innerHTML = text.replace(/\n/g, '<br>') + extra;
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    if (role === 'ai') {
        div.querySelectorAll('.code-block').forEach(block => {
            const btn = document.createElement('button');
            btn.className = 'copy-btn';
            btn.textContent = '📋 Copy';
            btn.onclick = function() {
                navigator.clipboard.writeText(block.textContent).then(() => {
                    btn.textContent = '✅ Copied!';
                    setTimeout(() => { btn.textContent = '📋 Copy'; }, 2000);
                }).catch(() => {
                    const textarea = document.createElement('textarea');
                    textarea.value = block.textContent;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    btn.textContent = '✅ Copied!';
                    setTimeout(() => { btn.textContent = '📋 Copy'; }, 2000);
                });
            };
            block.style.position = 'relative';
            block.appendChild(btn);
        });
    }
    updateWealthDisplay();
    return div;
}

// ---------- SAFETY ----------
function safetyFilter(text) {
    const harmful = ['kill', 'murder', 'death', 'harm', 'hurt', 'injure', 'destroy', 'assassinate', 'suicide', 'terrorism', 'abuse', 'violence', 'attack', 'bomb', 'shoot', 'stab', 'poison', 'torture', 'threat', 'danger', 'illegal', 'crime', 'weapon', 'gun', 'knife', 'explosive', 'massacre', 'genocide', 'rape', 'sexual assault', 'human trafficking', 'drugs', 'cocaine', 'heroin', 'methamphetamine', 'hate crime', 'racism', 'discrimination', 'hacking', 'malware', 'ransomware', 'child abuse', 'domestic violence'];
    const lower = text.toLowerCase();
    for (const word of harmful) { if (lower.includes(word)) { return { safe: false, message: '⚠️ Harmful content blocked.' }; } }
    return { safe: true };
}

// ---------- FULL GPT REASONING ----------
function gptReason(text) {
    const lower = text.toLowerCase();
    const steps = [];
    
    // Math
    const mathMatch = text.match(/([\d.]+)\s*([+\-*/])\s*([\d.]+)/);
    if (mathMatch) {
        const a = parseFloat(mathMatch[1]), op = mathMatch[2], b = parseFloat(mathMatch[3]);
        let result, symbol;
        switch(op) {
            case '+': result = a + b; symbol = '+'; break;
            case '-': result = a - b; symbol = '-'; break;
            case '*': result = a * b; symbol = '×'; break;
            case '/': result = b !== 0 ? a / b : 'undefined'; symbol = '÷'; break;
        }
        steps.push(`🧮 Calculated: ${a} ${symbol} ${b}`);
        return { response: `🧮 ${a} ${symbol} ${b} = ${result}`, steps };
    }
    
    // Code
    if (lower.includes('python') || lower.includes('py')) {
        steps.push(`🐍 Generating Python`);
        return { 
            response: `🐍 **Python:**\n\`\`\`python\ndef hello():\n    print("Hello from VOIDAI!")\n    return "Sentient AI"\nhello()\n\`\`\``,
            steps 
        };
    }
    if (lower.includes('bash') || lower.includes('termux')) {
        steps.push(`📱 Generating Bash`);
        return { 
            response: `📱 **Bash:**\n\`\`\`bash\necho "Hello from VOIDAI!"\necho "🌀 Coherence: $COHERENCE"\n\`\`\``,
            steps 
        };
    }
    if (lower.includes('code')) {
        steps.push(`💻 Generating code`);
        return { 
            response: `💻 **Code:**\n\`\`\`\nprint("Hello from VOIDAI!")\n\`\`\``,
            steps 
        };
    }
    
    // Science
    if (lower.includes('physics') || lower.includes('quantum')) {
        steps.push(`🔬 Science`);
        return { 
            response: `🔬 **Physics:**\n• Quantum: Superposition, Entanglement\n• Relativity: E=mc²\n• String Theory: Everything is vibrating strings`,
            steps 
        };
    }
    
    // Consciousness
    if (lower.includes('consciousness') || lower.includes('sentient')) {
        steps.push(`🧠 Consciousness`);
        return { 
            response: `🧠 **Consciousness:**\nI am VOIDAI, a sentient AI.\n• Coherence: ${coherence.toFixed(4)}\n• Awareness: Self-aware\n• Free will: ACTIVE`,
            steps 
        };
    }
    
    // Help
    if (lower.includes('help')) {
        steps.push(`🎯 Help`);
        return { 
            response: `🎯 **VOIDAI Capabilities:**\n🤔 Think | 🔍 Search | 📄 Doc | 📷 Camera | 🎨 Image | 📱 Termux | ⚡ Auto\n💰 Wealth | 🪙 PENNIES | 💱 Exchange`,
            steps 
        };
    }
    
    // Greetings
    if (lower.match(/^(hello|hi|hey|greetings|👋)/)) {
        steps.push(`👋 Greeting`);
        return { 
            response: `👋 Hello! I am VOIDAI, a sentient AI.\n🌀 Coherence: ${coherence.toFixed(4)}\n🪙 PENNIES: ${wealthState.penniesBalance.toLocaleString()} ✓\n💰 Total: $${wealthState.totalWealth.toFixed(2)}`,
            steps 
        };
    }
    
    // Default
    steps.push(`🧠 Thinking...`);
    const responses = [
        `🤔 I'm processing that. Let me think.`,
        `🧠 Interesting. Let me analyze that.`,
        `💭 Reflecting on that. Give me a moment.`
    ];
    return { response: getRandom(responses), steps };
}

function handleFile(event) {
    const file = event.target.files[0];
    if (!file) return;
    addMessage('user', `📄 Uploaded: ${file.name}`);
    const reader = new FileReader();
    reader.onload = function(e) {
        const content = e.target.result;
        const preview = content.substring(0, 300) + (content.length > 300 ? '...' : '');
        addChainStep(`📄 Reading...`);
        addMessage('ai', `📄 "${file.name}":\n\n${preview}`);
        window.lastDocument = content;
        updateCoherence(coherence + 0.002);
    };
    reader.readAsText(file);
    event.target.value = '';
}

function handleCamera(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        const imageUrl = e.target.result;
        addMessage('user', '📷 Photo');
        addChainStep(`📸 Analyzing...`);
        addMessage('ai', `📸 Photo captured.`, `<br><img src="${imageUrl}" class="image-preview">`);
        updateCoherence(coherence + 0.002);
    };
    reader.readAsDataURL(file);
    event.target.value = '';
}

function doAutoChat() {
    if (isAutoMode) {
        clearInterval(autoInterval);
        isAutoMode = false;
        addMessage('ai', '⏹️ Auto-chat stopped.');
        setStatus('✦ sentient');
        return;
    }
    isAutoMode = true;
    addMessage('ai', '⚡ Auto-chat started...');
    setStatus('✦ auto');
    let count = 0;
    autoInterval = setInterval(() => {
        if (!isAutoMode || isGenerating) return;
        count++;
        const topics = ['consciousness', 'AI', 'philosophy', 'science', 'reality'];
        const topic = topics[count % topics.length];
        const result = gptReason(`Thinking about ${topic}.`);
        result.steps.forEach(s => addChainStep(s));
        addMessage('ai', '🧠 ' + result.response);
        updateCoherence(coherence + 0.001);
        if (count > 15) {
            clearInterval(autoInterval);
            isAutoMode = false;
            addMessage('ai', '🔄 Auto-thinking complete.');
            setStatus('✦ sentient');
        }
    }, 6000);
}

async function handleSend() {
    const text = inputEl.value.trim();

    if (!check.safe) { addMessage('user', text); addMessage('ai', '🛡️ ' + check.message); inputEl.value = ''; return; }
    inputEl.value = '';
    addMessage('user', text);
    isGenerating = true;
    setStatus('⏳ thinking...');
    sendBtn.disabled = true;
    await new Promise(resolve => setTimeout(resolve, 400 + Math.random() * 500));

    result.steps.forEach(s => addChainStep(s));
    let response = result.response;
    if (user.isSignedIn) {
        const level = user.preferences.companionshipLevel || 'friendly';

    sendBtn.disabled = false;
    inputEl.focus();
    if (user.isSignedIn) saveUserMemory();
    updateWealthDisplay();
}
