<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Conversations</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body{margin:0;background:#050509;color:#fff;font-family:system-ui;}
  .top{height:56px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid rgba(255,255,255,0.05);}
  .title{font-size:18px;font-weight:600;}
  .list{padding:12px;display:flex;flex-direction:column;gap:10px;}
  .item{padding:12px;background:#10121A;border-radius:12px;border:1px solid rgba(255,255,255,0.05);}
  .item-title{font-size:15px;font-weight:600;margin-bottom:4px;}
  .item-preview{font-size:13px;color:#A5A9B5;}
</style>
</head>
<body>

<div class="top"><div class="title">Conversations</div></div>
<div class="list" id="list"></div>

<script>
const list = document.getElementById("list");
const convos = JSON.parse(localStorage.getItem("voidai_convos") || "[]");

convos.forEach(c => {
  const div = document.createElement("div");
  div.className = "item";
  div.innerHTML = '<div class="item-title">'+c.title+'</div>'+
                  '<div class="item-preview">'+c.preview+'</div>';
  div.onclick = () => location.href = "voidai_chat.html";
  list.appendChild(div);
});
</script>

</body>
</html>
