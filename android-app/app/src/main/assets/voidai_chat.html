<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>VOIDAI GPT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  body {
    margin: 0;
    background: #050509;
    color: #ffffff;
    font-family: system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  .top {
    height: 56px;
    display: flex;
    align-items: center;
    padding: 0 16px;
    background: #050509;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .title {
    flex: 1;
    font-size: 18px;
    font-weight: 600;
  }
  .chip {
    padding: 6px 12px;
    border-radius: 999px;
    background: #151823;
    border: 1px solid #3A3F48;
    color: #A5A9B5;
    font-size: 13px;
  }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 80%;
    padding: 10px 12px;
    border-radius: 12px;
    font-size: 14px;
  }
  .ai { background: #10121A; }
  .user { background: #151823; margin-left: auto; }
  .composer {
    padding: 8px;
    background: #10121A;
    display: flex;
    gap: 8px;
  }
  .input {
    flex: 1;
    border-radius: 999px;
    border: 1px solid #3A3F48;
    background: #151823;
    padding: 10px 14px;
    color: #fff;
  }
  .btn {
    width: 40px;
    height: 40px;
    border-radius: 999px;
    background: #151823;
    border: none;
    color: #D0D4DC;
    font-size: 20px;
  }
</style>
</head>
<body>

<div class="top">
  <div class="title">VOIDAI GPT</div>
  <div class="chip">Instant</div>
</div>

<div class="messages" id="messages">
  <div class="msg ai">Start chatting with <b>VOIDAI GPT</b>.</div>
</div>

<div class="composer">
  <button class="btn" id="plus">+</button>
  <input id="input" class="input" placeholder="Type a message..." />
  <button class="btn" id="send">&#10148;</button>
</div>

<script>
const input = document.getElementById("input");
const send = document.getElementById("send");
const messages = document.getElementById("messages");

function add(text, who) {
  const div = document.createElement("div");
  div.className = "msg " + who;
  div.textContent = text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

send.onclick = () => {
  const t = input.value.trim();
  if (!t) return;
  add(t, "user");
  input.value = "";
  setTimeout(() => add("VOIDAI GPT: " + t, "ai"), 300);
};
</script>

</body>
</html>
