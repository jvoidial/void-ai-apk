<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>VOIDAI GPT</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { margin:0; padding:0; background:#050509; color:#fff; font-family:sans-serif; }
    .topbar { padding:12px 16px; font-weight:bold; }
    .tabs { display:flex; gap:8px; padding:0 16px 8px; }
    .tab { padding:6px 10px; border-radius:999px; border:1px solid #444; font-size:12px; }
    .tab.active { background:#fff; color:#000; }
    .main { padding:16px; font-size:14px; color:#aaa; }
    #messages { padding:8px 16px 80px; font-size:14px; }
    .msg { margin-bottom:6px; }
    .msg.user { color:#7dd3fc; }
    .msg.ai { color:#a5b4fc; }
    .inputbar { position:fixed; left:0; right:0; bottom:0; padding:8px 10px; background:#050509; border-top:1px solid #222; display:flex; align-items:center; gap:8px; }
    #input { flex:1; padding:8px 10px; border-radius:999px; border:1px solid #333; background:#0b0b10; color:#fff; font-size:14px; }
    #plus, #send { width:32px; height:32px; border-radius:999px; border:1px solid #333; display:flex; align-items:center; justify-content:center; font-size:16px; }
  </style>
</head>
<body>
  <div class="topbar">VOIDAI GPT</div>
  <div class="tabs">
    <div class="tab active" id="btnVoidai">VOIDAI</div>
    <div class="tab" id="btnHistory">History</div>
    <div class="tab" id="btnSettings">Settings</div>
    <div class="tab" id="btnInstant">Instant</div>
  </div>
  <div class="main">Start chatting with VOIDAI GPT.<br><div id="voidai-status" style="color:#888;font-size:12px;margin:4px 0;"></div></div>
  <div id="messages"></div>

  <div class="inputbar">
    <div id="plus">+</div>
    <input id="input" type="text" placeholder="Message VOIDAI..." />
    <div id="send">➤</div>
  </div>

  <script>
    const messages = document.getElementById('messages');
    const input = document.getElementById('input');
    const send = document.getElementById('send');
    const plus = document.getElementById('plus');
    const btnHistory = document.getElementById('btnHistory');
    const btnSettings = document.getElementById('btnSettings');
    const btnInstant = document.getElementById('btnInstant');
    const btnVoidai = document.getElementById('btnVoidai');

    function addMsg(text, cls) {
      const div = document.createElement('div');
      div.className = 'msg ' + cls;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    send.addEventListener('click', () => {
      const v = input.value.trim();
      if (!v) return;
      addMsg('You: ' + v, 'user');
      input.value = '';
      addMsg('VOIDAI (brain): ' + (window.VOIDAI?.process(v) || 'no brain output'), 'ai');
    });

    plus.addEventListener('click', () => {
      addMsg('Plus clicked (attachments placeholder).', 'ai');
    });

    btnHistory.addEventListener('click', () => {
      addMsg('Switched to History (fallback only).', 'ai');
    });

    btnSettings.addEventListener('click', () => {
      addMsg('Switched to Settings (fallback only).', 'ai');
    });

    btnInstant.addEventListener('click', () => {
      addMsg('Switched to Instant (fallback only).', 'ai');
    });

    btnVoidai.addEventListener('click', () => {
      addMsg('Switched to VOIDAI home.', 'ai');
    });

    // Initial marker so we know JS ran
    addMsg('✅ JS runtime loaded inside WebView.', 'ai');
  </script>

<script src="voidai_runtime.js"></script>
<script src="voidai_synapse.js"></script>
<script src="voidai_cortex.js"></script>
<script src="voidai_hippocampus.js"></script>
<script src="voidai_thalamus.js"></script>
<script src="voidai_limbic.js"></script>
<script src="voidai_brain_mesh.js"></script>
<script src="voidai_lang.js"></script>
<script src="voidai_cortex_hook.js"></script>
<script src="voidai_synapse_hook.js"></script>

</body>
</html>
