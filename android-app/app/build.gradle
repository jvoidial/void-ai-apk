plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

android {
    // ─── Load .env (local only, never committed) ───
    def voidaiEnv = [:]
    def envFile = rootProject.file(".env")
    if (!envFile.exists()) envFile = file("../../.env")
    if (envFile.exists()) {
        envFile.eachLine { line ->
            line = line.trim()
            if (line && !line.startsWith("#") && line.contains("=")) {
                def idx = line.indexOf("=")
                voidaiEnv[line.substring(0, idx).trim()] = line.substring(idx + 1).trim()
            }
        }
    }
    def voidaiGet = { String k, String fallback = "" ->
        voidaiEnv[k] ?: System.getenv(k) ?: fallback
    }

    namespace 'com.voidai.app'
    compileSdk 34

    defaultConfig {
        buildConfigField "String", "SUPABASE_URL",      "\"" + voidaiGet("SUPABASE_URL", "https://wtyksmoqeehmbcqwedkc.supabase.co") + "\""
        buildConfigField "String", "SUPABASE_ANON_KEY", "\"" + voidaiGet("SUPABASE_ANON_KEY", "sb_publishable_xlfATZ6QU2ATxhWrdkfKpQ_l3a0gF4P") + "\""
        buildConfigField "String", "GROQ_API_KEY",      "\"" + voidaiGet("GROQ_API_KEY")      + "\""
        buildConfigField "String", "OPENAI_API_KEY",    "\"" + voidaiGet("OPENAI_API_KEY")    + "\""
        buildConfigField "String", "OPENROUTER_API_KEY","\"" + voidaiGet("OPENROUTER_API_KEY")+ "\""

        applicationId "com.voidai.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
    }

    packaging {
        resources {
            excludes += [
                '/META-INF/{AL2.0,LGPL2.1}',
                '/META-INF/INDEX.LIST',
                '/META-INF/DEPENDENCIES',
                'META-INF/versions/9/OSGI-INF/MANIFEST.MF',
                'META-INF/*.kotlin_module'
            ]
        }
    }
}

dependencies {
    // AndroidX
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.multidex:multidex:2.0.1'

    // Core library desugaring
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    // Supabase Kotlin SDK
    implementation platform('io.github.jan-tennert.supabase:bom:3.3.0')
    implementation 'io.github.jan-tennert.supabase:auth-kt'
    implementation 'io.github.jan-tennert.supabase:storage-kt'
    implementation 'io.github.jan-tennert.supabase:postgrest-kt'

    // Ktor 3.0.2 — required version for Supabase 3.0.1
    implementation 'io.ktor:ktor-client-core:3.0.3'
    implementation 'io.ktor:ktor-client-android:3.0.3'
    implementation 'io.ktor:ktor-client-content-negotiation:3.0.3'
    implementation 'io.ktor:ktor-serialization-kotlinx-json:3.0.3'
    implementation 'io.ktor:ktor-utils-jvm:3.0.3'

    // Kotlinx serialization
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-datetime:0.5.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
