plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'   // ← REQUIRED
}

android {
    namespace 'com.voidai.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.voidai.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Required by Supabase SDK on Android
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true   // ← REQUIRED by Ktor/Supabase
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
    }

    packaging {
        resources {
            excludes += [
                '/META-INF/{AL2.0,LGPL2.1}',
                '/META-INF/INDEX.LIST',
                '/META-INF/DEPENDENCIES',
                'META-INF/versions/9/OSGI-INF/MANIFEST.MF',
                'META-INF/*.kotlin_module'
            ]
        }
    }
}

dependencies {
    // AndroidX
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.multidex:multidex:2.0.1'

    // Core library desugaring
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    // Supabase Kotlin SDK
    implementation platform('io.github.jan-tennert.supabase:bom:3.0.1')
    implementation 'io.github.jan-tennert.supabase:auth-kt'
    implementation 'io.github.jan-tennert.supabase:storage-kt'
    implementation 'io.github.jan-tennert.supabase:postgrest-kt'

    // Ktor 3.x — client for Android
    implementation 'io.ktor:ktor-client-core:3.0.0'
    implementation 'io.ktor:ktor-client-android:3.0.0'
    implementation 'io.ktor:ktor-client-content-negotiation:3.0.0'
    implementation 'io.ktor:ktor-serialization-kotlinx-json:3.0.0'
    implementation 'io.ktor:ktor-utils-jvm:3.0.0'

    // Kotlinx serialization
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-datetime:0.5.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
