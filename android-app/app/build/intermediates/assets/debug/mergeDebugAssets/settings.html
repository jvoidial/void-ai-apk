<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Settings</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body { margin:0; background:#050509; color:#fff; font-family:system-ui; }
  .top { height:56px; display:flex; align-items:center; padding:0 16px;
         border-bottom:1px solid rgba(255,255,255,0.05); }
  .title { font-size:18px; font-weight:600; }

  .section { padding:16px; }
  .card {
    background:#10121A;
    border:1px solid rgba(255,255,255,0.05);
    border-radius:12px;
    padding:16px;
    margin-bottom:16px;
  }
  .label { font-size:14px; color:#A5A9B5; margin-bottom:6px; }
  .value { font-size:16px; font-weight:600; }
  .btn {
    margin-top:12px;
    padding:10px 14px;
    background:#151823;
    border:1px solid #3A3F48;
    border-radius:8px;
    color:#A5A9B5;
    text-align:center;
  }
</style>
</head>
<body>

<div class="top"><div class="title">Settings</div></div>

<div class="section">

  <div class="card">
    <div class="label">Current Model</div>
    <div class="value" id="model"></div>
  </div>

  <div class="card">
    <div class="label">Theme</div>
    <div class="value">Black / White / Silver</div>
  </div>

  <div class="card">
    <div class="label">Conversation History</div>
    <div class="btn" id="clear">Clear History</div>
  </div>

</div>

<script>
document.getElementById("model").textContent =
  localStorage.getItem("voidai_model") || "Instant";

document.getElementById("clear").onclick = () => {
  localStorage.removeItem("voidai_convos");
  alert("Conversation history cleared.");
};
</script>

</body>
</html>
