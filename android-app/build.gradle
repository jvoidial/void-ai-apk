buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.5.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.23")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

android {
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "VOIDAI.apk"
        }
    }
}
