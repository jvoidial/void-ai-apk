name: VOIDAI Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Copy WebLLM index.html to Android assets
        run: |
          mkdir -p android-app/app/src/main/assets
          cp app/src/main/assets/index.html android-app/app/src/main/assets/index.html
          echo "✅ WebLLM index.html copied to Android assets"
          echo "=== First 10 lines ==="
          head -10 android-app/app/src/main/assets/index.html
          if grep -q "webllm" android-app/app/src/main/assets/index.html; then
            echo "✅ WebLLM content verified!"
          else
            echo "❌ WebLLM content NOT found!"
            exit 1
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x android-app/gradlew

      - name: Build Debug APK
        working-directory: android-app
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VOIDAI
          path: android-app/app/build/outputs/apk/debug/VOIDAI.apk
