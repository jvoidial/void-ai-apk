name: CAT-EOF-VOIDAI-SYNC
on:
  workflow_dispatch:
  repository_dispatch:
  push:
    branches: [ "main" ]

jobs:
  sync-build:
    runs-on: ubuntu-latest
    steps:
      - name: CAT EOF • Checkout
        uses: actions/checkout@v4

      - name: CAT EOF • JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: CAT EOF • Android SDK
        uses: android-actions/setup-android@v3

      - name: CAT EOF • Verify index.html
        run: |
          echo "=== index.html content (first 5 lines) ==="
          head -5 android-app/app/src/main/assets/index.html
          echo "==========================================="

      - name: CAT EOF • Gradle Exec
        run: chmod +x android-app/gradlew

      - name: CAT EOF • Build APK
        working-directory: android-app
        run: ./gradlew clean assembleDebug --stacktrace

      - name: CAT EOF • Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VOIDAI-synced-apk
          path: android-app/app/build/outputs/apk/debug/VOIDAI.apk
