name: CAT-EOF-VOIDAI-SYNC
on:
  workflow_dispatch:
  repository_dispatch:
  push:
    branches: [ "main" ]

jobs:
  sync-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject PHB API URL
        run: |
          echo "PHB_API_BASE_URL=${{ secrets.PHB_API_URL }}" > android-app/app/src/main/assets/phb_api_env.txt

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle permission
        run: chmod +x android-app/gradlew

      - name: Build APK
        working-directory: android-app
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VOIDAI-synced-apk
          path: android-app/app/build/outputs/apk/debug/VOIDAI.apk
